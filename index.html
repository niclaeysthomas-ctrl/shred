<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0b09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shred">
<link rel="manifest" href="manifest.webmanifest">
<title>Shred</title>
<style>
  :root{
    --bg:#0d0b09; --bg2:#171310; --bg3:#221c17; --line:#33291f;
    --txt:#f0e9df; --dim:#a08f7c; --acc:#e8a13c; --acc2:#c07a1e;
    --ok:#6bcf7a; --bad:#ff6b5c; --blue:#6aa9ff; --str:#e7d8b6; --r:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  main{flex:1;padding:16px 16px 92px}
  header{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:900;font-size:19px;letter-spacing:1px}
  .logo span{color:var(--acc)}
  .badge{font-weight:700;font-size:13px;background:var(--bg2);border:1px solid var(--line);padding:6px 12px;border-radius:20px}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  h1.page{font-size:22px;font-weight:800;margin-bottom:6px}
  .lead{color:var(--dim);font-size:14px;line-height:1.5;margin-bottom:14px}
  .btn{display:inline-block;border:none;border-radius:12px;padding:13px 20px;font-size:15px;font-weight:800;
    cursor:pointer;background:var(--acc);color:#1a1200;width:100%;text-align:center;margin-top:12px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
  .btn.small{width:auto;padding:9px 15px;font-size:13px;margin-top:0}
  .btn:disabled{opacity:.4;pointer-events:none}
  .row2{display:flex;gap:10px} .row2 .btn{margin-top:0}

  /* ---------- fretboard ---------- */
  .fbwrap{overflow-x:auto;padding:4px 0 2px;margin:6px 0;scrollbar-width:none}
  .fbwrap::-webkit-scrollbar{display:none}
  .fb{display:flex;flex-direction:column;background:linear-gradient(180deg,#2a2018,#1c150f);
    border:1px solid var(--line);border-radius:8px;min-width:520px}
  .frow{display:grid;grid-template-columns:38px repeat(12,minmax(34px,1fr));height:36px}
  .fcell{position:relative;border-right:1px solid #4a3826;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .fcell.nut{border-right:3px solid #b9a074}
  .fcell .sl{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--str);opacity:.45;transform:translateY(-1px)}
  .frow:nth-child(1) .sl,.frow:nth-child(2) .sl{height:1.5px}
  .frow:nth-child(6) .sl{height:3px}
  .fdot{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:12px;z-index:2;background:var(--bg3);color:var(--txt);border:1px solid var(--line)}
  .fdot.on{background:var(--acc);color:#1a1200;border-color:var(--acc)}
  .fdot.root{background:var(--bad);color:#fff;border-color:var(--bad)}
  .fdot.ask{background:transparent;color:var(--acc);border:2px dashed var(--acc);font-size:16px}
  .fdot.ok{background:var(--ok);color:#04220c;border-color:var(--ok)}
  .fdot.no{background:var(--bad);color:#fff;border-color:var(--bad)}
  .fcell.flash .sl{background:var(--acc);opacity:.9}
  .fnums{display:grid;grid-template-columns:38px repeat(12,minmax(34px,1fr));min-width:520px;margin-top:3px}
  .fnums div{text-align:center;font-size:11px;color:var(--dim);font-weight:700;position:relative}
  .fnums div.mk::after{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#5a4832}
  .fnums div.mk2::after{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:none;box-shadow:-5px 0 0 #5a4832,5px 0 0 #5a4832}

  .toolrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .tag{padding:8px 13px;border-radius:20px;background:var(--bg3);border:1px solid var(--line);font-size:13px;font-weight:700;cursor:pointer}
  .tag.on{background:var(--acc);color:#1a1200;border-color:var(--acc)}

  /* ---------- review / cards ---------- */
  .qhead{text-align:center;margin:6px 0}
  .qhead .q{font-size:19px;font-weight:800}
  .qhead .sub{color:var(--dim);font-size:13px;margin-top:3px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .opt{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:15px;font-size:18px;font-weight:800;cursor:pointer}
  .opt.right{background:#16351f;border-color:var(--ok);color:var(--ok)}
  .opt.wrong{background:#3a1a18;border-color:var(--bad);color:var(--bad)}
  .fb-progress{display:flex;gap:14px;justify-content:center;margin:10px 0;font-size:13px;color:var(--dim);font-weight:700}
  .fb-progress b{color:var(--acc)}
  .statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px}
  .stat{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .stat b{display:block;font-size:22px;color:var(--acc)} .stat small{color:var(--dim);font-size:11px}

  /* ---------- theory ---------- */
  .theory{line-height:1.6;font-size:15px}
  .theory h3{color:var(--acc);font-size:16px;margin:18px 0 6px}
  .theory p{margin-bottom:10px;color:#d8cebf}
  .theory ul{margin:0 0 10px 18px;color:#d8cebf} .theory li{margin-bottom:5px}
  .theory .tip{background:#241a10;border-left:3px solid var(--acc);padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0;font-size:14px}
  .theory .formula{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;font-weight:800;margin:12px 0;line-height:1.6}
  .lesson{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:8px;cursor:pointer}
  .lesson .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--bg3);flex-shrink:0}
  .lesson .t b{display:block;font-size:15px} .lesson .t small{color:var(--dim);font-size:12px}

  .soon{opacity:.55}
  .soon .pill{font-size:10px;font-weight:800;color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:2px 7px;margin-left:6px}
  .step{display:flex;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
  .step .n{width:30px;height:30px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
  .step.now .n{background:var(--acc);color:#1a1200}
  .step b{font-size:15px} .step small{color:var(--dim);font-size:13px;line-height:1.5;display:block;margin-top:2px}

  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,11,9,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:40}
  nav .in{max-width:560px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border:none;color:var(--dim);padding:10px 0 max(10px,env(safe-area-inset-bottom));font-size:11px;font-weight:700;cursor:pointer}
  nav button .i{display:block;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--acc)}

  .overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none}
  .overlay.open{display:block}
  .overlay .inner{max-width:560px;margin:0 auto;padding:16px 16px 40px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:8px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5}
  .topbar .back{width:38px;height:38px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer}
  .topbar b{font-size:16px}
  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--bg3);border:1px solid var(--acc);color:var(--txt);padding:12px 20px;border-radius:14px;font-weight:700;z-index:100;transition:transform .35s;font-size:14px}
  #toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header><div class="logo">SH<span>RED</span></div><div class="badge" id="badge">🎸</div></header>
  <main id="main"></main>
  <nav><div class="in">
    <button data-tab="manche" class="on"><span class="i">🎸</span>Manche</button>
    <button data-tab="cartes"><span class="i">🔁</span>Cartes</button>
    <button data-tab="theorie"><span class="i">📖</span>Théorie</button>
    <button data-tab="suite"><span class="i">✨</span>Suite</button>
  </div></nav>
</div>
<div class="overlay" id="overlay"><div class="inner" id="overlayInner"></div></div>
<div id="toast"></div>
<script>
/* ================================================================
   SHRED — reconstruction. Étape 1 : connaître le manche par cœur.
   ================================================================ */
const NOTES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const NOTES_FR=['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const NAT=[0,2,4,5,7,9,11];                 /* pitch-class des notes naturelles */
const OPEN=[40,45,50,55,59,64];             /* Mi La Ré Sol Si Mi (grave→aigu), MIDI */
const STR_NAME=['Mi grave','La','Ré','Sol','Si','Mi aigu'];
const strNo=s=>6-s;                          /* numéro guitariste : corde 1 = Mi aigu */
const midiAt=(s,f)=>OPEN[s]+f;
const noteAt=(s,f)=>NOTES[midiAt(s,f)%12];
const FRETS=12;

/* ---------------- état ---------------- */
const DEFAULT={cards:{}, newDay:{date:null,n:0}, streak:0, lastDay:null, xp:0,
  seen:0, right:0, showNames:false, natOnly:true};
let S=load();
function load(){ try{return Object.assign({},DEFAULT,JSON.parse(localStorage.getItem('shred2')||'{}'));}catch(e){return {...DEFAULT};} }
function save(){ localStorage.setItem('shred2',JSON.stringify(S)); }
const today=()=>new Date().toISOString().slice(0,10);
function markDay(){ const t=today(); if(S.lastDay!==t){ const y=new Date(Date.now()-864e5).toISOString().slice(0,10); S.streak=(S.lastDay===y)?S.streak+1:1; S.lastDay=t; save(); } }

/* ---------------- audio : corde pincée (Karplus-Strong) ---------------- */
let AC=null;
function ac(){ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; }
function pluck(midi,dur=1.3,vel=.5){
  const ctx=ac(), sr=ctx.sampleRate, f=440*Math.pow(2,(midi-69)/12);
  const N=Math.max(2,Math.round(sr/f)), len=Math.floor(sr*dur);
  const buf=ctx.createBuffer(1,len,sr), d=buf.getChannelData(0), y=new Float32Array(len);
  for(let i=0;i<N;i++) y[i]=Math.random()*2-1;
  const damp=.9955;
  for(let i=N;i<len;i++) y[i]=damp*.5*(y[i-N]+y[i-N+1]);
  for(let i=0;i<len;i++){ const env=Math.min(1,i/220)*(1-i/len); d[i]=y[i]*vel*env; }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=Math.min(sr/2,f*7+1800);
  const g=ctx.createGain(); g.gain.value=1;
  src.connect(lp); lp.connect(g); g.connect(ctx.destination); src.start();
}

/* ---------------- SRS (façon Anki / SM-2 simplifié) ---------------- */
function deck(){ const ids=[]; for(let s=0;s<6;s++)for(let f=0;f<=FRETS;f++){ const pc=midiAt(s,f)%12; if(S.natOnly&&!NAT.includes(pc))continue; ids.push('fb:'+s+':'+f); } return ids; }
function parseCard(id){ const p=id.split(':'); const s=+p[1], f=+p[2]; return {s,f,note:noteAt(s,f)}; }
const NEW_PER_DAY=8;
function newBudget(){ const t=today(); if(S.newDay.date!==t){ S.newDay={date:t,n:0}; save(); } return Math.max(0,NEW_PER_DAY-S.newDay.n); }
function dueList(){ const now=Date.now(); return deck().filter(id=>S.cards[id]&&S.cards[id].due<=now); }
function newList(){ return deck().filter(id=>!S.cards[id]); }
function counts(){ return {due:dueList().length, neu:Math.min(newBudget(),newList().length), learned:Object.keys(S.cards).filter(id=>S.cards[id].reps>=2).length, total:deck().length}; }
function grade(id,q){ /* q: 'again' | 'good' | 'easy' */
  let c=S.cards[id]; const isNew=!c;
  if(isNew){ c={ef:2.4,iv:0,reps:0,due:0,lapses:0}; S.newDay.n++; }
  if(q==='again'){ c.reps=0; c.iv=0; c.lapses++; c.ef=Math.max(1.3,c.ef-.2); c.due=Date.now()+60000; }
  else{
    c.reps++;
    if(c.reps===1) c.iv=1; else if(c.reps===2) c.iv=3; else c.iv=Math.max(1,Math.round(c.iv*c.ef));
    if(q==='easy'){ c.iv=Math.round(c.iv*1.35); c.ef+=.15; }
    c.ef=Math.max(1.3,Math.min(2.8,c.ef));
    c.due=Date.now()+c.iv*864e5;
  }
  S.cards[id]=c; save();
}

/* ---------------- helpers DOM ---------------- */
function el(t,c,h){ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2100); }

/* ---------------- fretboard ---------------- */
function buildFretboard(onTap){
  const wrap=el('div','fbwrap');
  const fb=el('div','fb'); wrap.appendChild(fb);
  const cells={};
  for(let s=5;s>=0;s--){                       /* aigu en haut, grave en bas */
    const row=el('div','frow');
    for(let f=0;f<=FRETS;f++){
      const c=el('div','fcell'+(f===0?' nut':''));
      c.appendChild(el('div','sl'));
      c.dataset.s=s; c.dataset.f=f;
      c.onclick=()=>onTap&&onTap(s,f,c);
      row.appendChild(c); cells[s+':'+f]=c;
    }
    fb.appendChild(row);
  }
  const nums=el('div','fnums');
  const marks={3:1,5:1,7:1,9:1,12:2};
  for(let f=0;f<=FRETS;f++){ nums.appendChild(el('div',marks[f]===2?'mk2':marks[f]?'mk':'',''+f)); }
  wrap.appendChild(nums);
  wrap.cell=(s,f)=>cells[s+':'+f];
  wrap.clearDots=()=>{ Object.values(cells).forEach(c=>{ const d=c.querySelector('.fdot'); if(d)d.remove(); }); };
  wrap.dot=(s,f,label,cls)=>{ const c=cells[s+':'+f]; if(!c)return; let d=c.querySelector('.fdot'); if(!d){ d=el('div','fdot'); c.appendChild(d);} d.className='fdot '+(cls||''); d.textContent=label==null?'':label; return d; };
  return wrap;
}

/* ================================================================
   VUE : LE MANCHE (explorer)
   ================================================================ */
function renderManche(){
  const m=document.getElementById('main'); m.innerHTML='';
  m.appendChild(el('h1','page','Le manche'));
  m.appendChild(el('p','lead','Étape 1 : le connaître par cœur. Touche une case pour l’entendre et voir sa note. Puis fais les cartes — c’est la répétition espacée qui ancre.'));

  const c=el('div','card');
  const showTag=el('div','tag'+(S.showNames?' on':''),'👁 Voir les notes');
  const natTag=el('div','tag'+(S.natOnly?' on':''),'Naturelles seules');
  const tools=el('div','toolrow'); tools.appendChild(showTag); tools.appendChild(natTag); c.appendChild(tools);
  const fb=buildFretboard((s,f,cell)=>{ pluck(midiAt(s,f)); cell.classList.add('flash'); setTimeout(()=>cell.classList.remove('flash'),200);
    if(!S.showNames){ const d=fb.dot(s,f, noteAt(s,f), midiAt(s,f)%12===0?'root':(NAT.includes(midiAt(s,f)%12)?'on':'')); setTimeout(()=>{ if(!S.showNames&&d&&d.parentNode)d.remove(); },1100); } });
  c.appendChild(fb); m.appendChild(c);
  function paint(){ fb.clearDots(); if(S.showNames){ for(let s=0;s<6;s++)for(let f=0;f<=FRETS;f++){ const pc=midiAt(s,f)%12; if(S.natOnly&&!NAT.includes(pc))continue; fb.dot(s,f,noteAt(s,f), pc===0?'root':(NAT.includes(pc)?'on':'')); } } }
  showTag.onclick=()=>{ S.showNames=!S.showNames; save(); showTag.classList.toggle('on',S.showNames); paint(); };
  natTag.onclick=()=>{ S.natOnly=!S.natOnly; save(); natTag.classList.toggle('on',S.natOnly); paint(); };
  paint();

  const c2=el('div','card');
  c2.appendChild(el('b',null,'🎯 Entraînement rapide'));
  c2.appendChild(el('p','lead','L’app te montre une case, tu nommes la note. 10 cases au hasard, sans pression.'));
  const b=el('button','btn','Nommer les cases (10)'); b.onclick=()=>openReview('quick'); c2.appendChild(b);
  m.appendChild(c2);

  const co=counts();
  const c3=el('div','card');
  c3.innerHTML='<b>Ta maîtrise du manche</b>';
  c3.appendChild(el('div','statgrid',
    `<div class="stat"><b>${co.learned}</b><small>cases sues</small></div>
     <div class="stat"><b>${co.due}</b><small>à revoir</small></div>
     <div class="stat"><b>${co.total}</b><small>au total</small></div>`));
  m.appendChild(c3);
}

/* ================================================================
   VUE : CARTES (révision espacée)
   ================================================================ */
function renderCartes(){
  const m=document.getElementById('main'); m.innerHTML='';
  m.appendChild(el('h1','page','Les cartes'));
  m.appendChild(el('p','lead','Répétition espacée, comme Anki. Une case bien sue revient de plus en plus tard ; une case ratée revient vite. C’est LE moteur pour graver le manche.'));
  const co=counts();
  const c=el('div','card');
  c.innerHTML='<b>Aujourd’hui</b>';
  c.appendChild(el('div','statgrid',
    `<div class="stat"><b>${co.due}</b><small>à réviser</small></div>
     <div class="stat"><b>${co.neu}</b><small>nouvelles</small></div>
     <div class="stat"><b>${co.learned}/${co.total}</b><small>ancrées</small></div>`));
  const total=co.due+co.neu;
  const b=el('button','btn', total? `▶ Réviser (${total} cartes)` : '✓ Rien à réviser — reviens plus tard');
  if(!total) b.disabled=true; b.onclick=()=>openReview('srs');
  c.appendChild(b); m.appendChild(c);

  const c2=el('div','card');
  c2.innerHTML=`<b>Comment ça marche</b>
   <p class="lead" style="margin:6px 0 0">Chaque case du manche est une carte. Tu la vois → tu nommes la note. Juste = elle revient plus tard (1 j, 3 j, 8 j…). Faux = elle revient dans la minute. ${NEW_PER_DAY} nouvelles cartes par jour, pour ne jamais te noyer.</p>`;
  m.appendChild(c2);
}

/* ---------------- moteur de révision ---------------- */
function openReview(mode){
  ac(); markDay();
  let queue;
  if(mode==='quick'){
    const d=deck().slice(); for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=d[i];d[i]=d[j];d[j]=t;}
    queue=d.slice(0,10);
  } else {
    queue=dueList(); queue=queue.concat(newList().slice(0,newBudget()));
    for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=queue[i];queue[i]=queue[j];queue[j]=t;}
  }
  if(!queue.length){ toast('Rien à réviser'); return; }
  let i=0, good=0;
  openOverlay('Révision', inner=>{
    const prog=el('div','fb-progress'); inner.appendChild(prog);
    const qh=el('div','qhead'); inner.appendChild(qh);
    const fb=buildFretboard(null); inner.appendChild(fb);
    const opts=el('div','opts'); inner.appendChild(opts);
    const foot=el('div'); inner.appendChild(foot);
    function step(){
      if(i>=queue.length) return finish();
      const id=queue[i], card=parseCard(id);
      prog.innerHTML=`Carte <b>${i+1}</b>/${queue.length} · ✓ ${good}`;
      qh.innerHTML=`<div class="q">Quelle note ?</div><div class="sub">Corde ${strNo(card.s)} (${STR_NAME[card.s]}) · case ${card.f}</div>`;
      fb.clearDots(); fb.dot(card.s,card.f,'?','ask'); foot.innerHTML='';
      const set=new Set([card.note]); while(set.size<4){ set.add(NOTES[NAT[Math.floor(Math.random()*NAT.length)]]); }
      const arr=[...set].sort(()=>Math.random()-.5);
      opts.innerHTML='';
      arr.forEach(n=>{ const bo=el('button','opt',n); bo.onclick=()=>answer(n,bo,id,card); opts.appendChild(bo); });
    }
    function answer(n,bo,id,card){
      opts.querySelectorAll('.opt').forEach(x=>x.style.pointerEvents='none');
      pluck(midiAt(card.s,card.f));
      const ok=n===card.note;
      if(ok){ bo.classList.add('right'); good++; fb.dot(card.s,card.f,card.note,'ok'); }
      else{ bo.classList.add('wrong'); opts.querySelectorAll('.opt').forEach(x=>{ if(x.textContent===card.note)x.classList.add('right'); }); fb.dot(card.s,card.f,card.note,'no'); }
      if(mode==='srs') grade(id, ok?'good':'again');
      else { S.seen++; if(ok)S.right++; save(); }
      const nx=el('button','btn', i+1<queue.length?'Suivant →':'Terminer');
      nx.onclick=()=>{ i++; step(); }; foot.appendChild(nx);
    }
    function finish(){
      if(mode==='srs'){ const back=queue.filter(id=>S.cards[id]&&S.cards[id].due<=Date.now()); if(back.length){ queue=back; i=0; return step(); } }
      const pct=Math.round(good/queue.length*100);
      qh.innerHTML=`<div class="q">${good}/${queue.length} — ${pct}%</div><div class="sub">${pct>=80?'Solide. Le manche se grave.':pct>=50?'Ça vient. Reviens demain, les cartes reviendront pile au bon moment.':'Normal au début. Regarde les notes dans « Manche », puis reviens.'}</div>`;
      fb.clearDots(); opts.innerHTML='';
      const cl=el('button','btn','Fermer'); cl.onclick=closeOverlay; foot.innerHTML=''; foot.appendChild(cl);
      if(good>0){ S.xp+=good*2; save(); }
    }
    step();
  });
}

/* ================================================================
   VUE : THÉORIE (de la base, simplement)
   ================================================================ */
const LESSONS=[
{id:'12notes', ic:'🔢', title:'Les 12 notes', sub:'Tout part de là', body:`
<p>La musique occidentale, c’est <b>12 notes</b>, et rien de plus :</p>
<div class="formula">Do · Do♯ · Ré · Ré♯ · Mi · Fa · Fa♯ · Sol · Sol♯ · La · La♯ · Si</div>
<p>(en lettres, comme sur les guitares : <b>C C♯ D D♯ E F F♯ G G♯ A A♯ B</b>). Après le Si, on reboucle sur le Do — une <b>octave</b> plus haut. Tout le manche n’est que ces 12 notes qui se répètent.</p>
<h3>Deux pièges à connaître</h3>
<ul><li>Entre <b>Mi–Fa</b> et entre <b>Si–Do</b>, il n’y a <b>pas</b> de dièse : ce sont des demi-tons « collés ».</li>
<li>Une case = <b>un demi-ton</b>. Monte d’une case = la note suivante dans la liste.</li></ul>
<div class="tip">Sur une corde à vide, monte de <b>12 cases</b> : tu retombes sur la même note, une octave plus haut. La case 12, c’est le grand repère du manche.</div>`},
{id:'accordage', ic:'🎸', title:'L’accordage : E A D G B E', sub:'Le nom des 6 cordes', body:`
<p>De la plus grave (la plus grosse) à la plus aiguë :</p>
<div class="formula">Mi – La – Ré – Sol – Si – Mi<br>E &nbsp; A &nbsp; D &nbsp; G &nbsp; B &nbsp; E</div>
<p>Moyen mnémotechnique : « <b>Every Adult Dog Growls, Barks, Eats</b> ». Les deux Mi (6e et 1re corde) sont à <b>deux octaves</b> d’écart — mêmes notes, hauteurs différentes.</p>
<h3>La logique cachée</h3>
<p>Chaque corde est accordée une <b>quarte</b> (5 cases) au-dessus de la précédente… <b>sauf</b> entre Sol et Si (une tierce, 4 cases). C’est cette petite exception qui rend le manche déroutant au début — mais une fois su, tout se déduit.</p>
<div class="tip">Conséquence utile : la case 5 d’une corde donne la note de la corde du dessus à vide. Case 5 de Mi grave = La = corde suivante à vide. (Exception : corde de Sol, c’est la case 4.)</div>`},
{id:'reperes', ic:'📍', title:'Se repérer sur le manche', sub:'Les cases-repères et les octaves', body:`
<p>Tu ne connais pas 72 cases séparément — tu connais <b>quelques repères</b> et tu déduis le reste.</p>
<h3>Les cases marquées</h3>
<p>Les points sur le manche sont à <b>3, 5, 7, 9</b> et (double point) <b>12</b>. Ce sont tes balises. Mémorise d’abord les notes sur la <b>corde de Mi grave</b> à ces cases : Sol (3), La (5), Si (7), Do♯ (9), Mi (12).</p>
<h3>Le motif de l’octave</h3>
<p>Un motif magique : <b>2 cordes plus haut, 2 cases plus loin</b> = la même note à l’octave. Tu connais une note ? Tu connais son octave, gratuitement.</p>
<div class="tip">Priorité : apprends d’abord la <b>corde de Mi grave</b> et la <b>corde de La</b>. Ce sont les fondamentales des accords — les connaître, c’est déjà pouvoir jouer partout.</div>`},
{id:'pourquoi-gammes', ic:'🪜', title:'Pourquoi la gamme majeure', sub:'L’alphabet de la musique (aperçu)', body:`
<p>Sur les 12 notes, une chanson n’en utilise en général que <b>7</b> : c’est une <b>gamme</b>. La plus importante, la gamme <b>majeure</b>, suit toujours le même écart de cases :</p>
<div class="formula">2 – 2 – 1 – 2 – 2 – 2 – 1 (cases)</div>
<p>Pars de n’importe quelle note, applique ce motif, et tu as sa gamme majeure. Ces 7 notes forment <b>l’alphabet</b> du morceau : les accords, la mélodie et tes solos en sortent tous.</p>
<h3>À quoi ça sert, concrètement</h3>
<p>Quand tu improvises, la gamme te dit <b>quelles notes vont sonner juste</b>. Pas besoin de deviner. Et sur la guitare, une gamme, c’est un <b>schéma de doigts</b> qu’on déplace : apprends la forme une fois, joue-la dans les 12 tonalités.</p>
<div class="tip">On attaque ça pour de vrai à l’<b>étape 3 (impro)</b> — d’abord le manche. Mais garde en tête : gamme = 7 notes qui appartiennent à la maison, et un schéma de doigts qui se déplace.</div>`},
];
function renderTheorie(){
  const m=document.getElementById('main'); m.innerHTML='';
  m.appendChild(el('h1','page','Théorie'));
  m.appendChild(el('p','lead','La base, vraiment simple, en partant de zéro. Juste ce qu’il faut pour comprendre le manche — le reste viendra.'));
  LESSONS.forEach(L=>{ const c=el('div','lesson',`<div class="ico">${L.ic}</div><div class="t"><b>${L.title}</b><small>${L.sub}</small></div>`);
    c.onclick=()=>openOverlay(L.title, inner=>{ inner.appendChild(el('div','theory',L.body)); const b=el('button','btn ghost','← Retour'); b.onclick=closeOverlay; inner.appendChild(b); }); m.appendChild(c); });
}

/* ================================================================
   VUE : SUITE (feuille de route)
   ================================================================ */
function renderSuite(){
  const m=document.getElementById('main'); m.innerHTML='';
  m.appendChild(el('h1','page','La suite'));
  m.appendChild(el('p','lead','On construit dans l’ordre. Chaque étape s’appuie sur la précédente — on n’ouvre la suivante que quand la base est solide.'));
  const steps=[
    ['1','🎸 Connaître le manche','En cours. Notes par cœur via les cartes, corde par corde. La fondation de tout le reste.',true],
    ['2','🎼 Accompagnement','Les accords (formes CAGED, barrés), avec des cartes « connais-tu cet accord ? » et des grilles à plaquer en rythme.',false],
    ['3','🎤 Impro','La penta d’abord (schémas à déplacer), puis viser les notes des accords dans le solo (la tierce, la fondamentale…) et pourquoi ça marche.',false],
    ['4','🌈 Les modes','Une fois le manche et l’impro en place : les 7 couleurs, par l’oreille et par les schémas.',false],
  ];
  steps.forEach(a=>{ const s=el('div','step'+(a[3]?' now':' soon')); s.innerHTML=`<div class="n">${a[0]}</div><div><b>${a[1]}${a[3]?'':'<span class="pill">bientôt</span>'}</b><small>${a[2]}</small></div>`; m.appendChild(s); });
  m.appendChild(el('div','card','<b>Pourquoi cet ordre ?</b><p class="lead" style="margin:6px 0 0">Impossible d’improviser ou de comprendre les accords sans savoir où sont les notes. Le manche d’abord, sans exception — c’est le seul raccourci qui existe.</p>'));
}

const overlay=document.getElementById('overlay'), overlayInner=document.getElementById('overlayInner');
function openOverlay(title,fill){ overlayInner.innerHTML=`<div class="topbar"><button class="back">←</button><b>${title}</b></div>`; overlayInner.querySelector('.back').onclick=closeOverlay; overlay.classList.add('open'); overlay.scrollTop=0; fill(overlayInner); }
function closeOverlay(){ overlay.classList.remove('open'); render(); }
let tab='manche';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); tab=b.dataset.tab; render(); });
function render(){ const co=counts(); document.getElementById('badge').textContent=(S.streak?'🔥 '+S.streak+'  ':'')+(co.due?('🔁 '+co.due):'🎸');
  if(tab==='manche')renderManche(); else if(tab==='cartes')renderCartes(); else if(tab==='theorie')renderTheorie(); else renderSuite(); }
render();
if(location.protocol.startsWith('http')&&'serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
